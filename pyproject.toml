[project]
name = "blender-mcp-server"
version = "3.0.0"
description = "MCP server that drives a live Blender 4.5 LTS instance: modelling, materials, lighting, rendering and image feedback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["blender", "mcp", "model-context-protocol", "3d", "bpy", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"
blender-mcp-setup = "blender_mcp.setup:main"

[project.urls]
Homepage = "https://github.com/Mishaadevv/blender-mcp"
Repository = "https://github.com/Mishaadevv/blender-mcp"
Issues = "https://github.com/Mishaadevv/blender-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
